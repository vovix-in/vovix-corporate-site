    <rect x="654" y="212" width="694" height="52" rx="8" fill="#fcfeff" stroke="#eef2f6" stroke-width="1"/>
    <text x="672" y="234" font-size="11" font-weight="700" fill="#102a43">Momentum &amp; structure</text>
    <text x="672" y="252" font-size="11" fill="#486581">Higher lows holding, RSI 58, MACD rising</text>
    <rect x="1240" y="226" width="92" height="24" rx="12" fill="rgba(0,200,83,0.12)"/>
    <text x="1286" y="242" font-weight="700" fill="#00a844" text-anchor="middle">Strong</text>

    <rect x="654" y="274" width="694" height="52" rx="8" fill="#fcfeff" stroke="#eef2f6" stroke-width="1"/>
    <text x="672" y="296" font-size="11" font-weight="700" fill="#102a43">News sentiment</text>
    <text x="672" y="314" font-size="11" fill="#486581">Risk-on tone, no red events near entry</text>
    <rect x="1240" y="288" width="92" height="24" rx="12" fill="rgba(0,200,83,0.12)"/>
    <text x="1286" y="304" font-weight="700" fill="#00a844" text-anchor="middle">Positive</text>
  </g>

