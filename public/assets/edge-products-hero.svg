  <text x="672" y="528" font-size="10" font-weight="700" letter-spacing="1.5" fill="#486581">ASSISTED EXIT &#183; AUTOPILOT (OPT-IN)</text>
  <rect x="672" y="538" width="196" height="24" rx="12" fill="rgba(0,200,83,0.1)" stroke="rgba(0,200,83,0.3)" stroke-width="1"/>
  <text x="770" y="554" font-size="11" font-weight="700" fill="#00a844" text-anchor="middle">Partial TP @ 1R &#183; ON</text>
  <rect x="880" y="538" width="176" height="24" rx="12" fill="rgba(0,200,83,0.1)" stroke="rgba(0,200,83,0.3)" stroke-width="1"/>
  <text x="968" y="554" font-size="11" font-weight="700" fill="#00a844" text-anchor="middle">Breakeven @ 1R &#183; ON</text>
  <rect x="1068" y="538" width="164" height="24" rx="12" fill="rgba(0,200,83,0.1)" stroke="rgba(0,200,83,0.3)" stroke-width="1"/>
  <text x="1150" y="554" font-size="11" font-weight="700" fill="#00a844" text-anchor="middle">Trailing 20p &#183; ON</text>

  <!-- Stand down card -->
  <rect x="654" y="582" width="694" height="118" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.45)" stroke-width="1.4"/>
  <rect x="672" y="600" width="128" height="24" rx="12" fill="rgba(245,158,11,0.16)"/>
  <text x="736" y="616" font-size="10" font-weight="800" letter-spacing="1" fill="#c07800" text-anchor="middle">STAND DOWN</text>
  <text x="814" y="618" font-size="14" font-weight="800" fill="#102a43">GBP/JPY</text>
  <text x="672" y="650" font-size="12" fill="#5b4a2a">Choppy regime &#183; red news in 40 min &#183; reward-to-risk below the bar.</text>
  <text x="672" y="676" font-size="13" font-weight="700" fill="#c07800">No signal shown &#8212; discipline over noise.</text>

  <!-- Footer metrics -->
  <rect x="654" y="712" width="694" height="60" rx="8" fill="rgba(16,42,67,0.02)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="672" y="734" font-size="10" font-weight="700" letter-spacing="1.5" fill="#486581">THIS WEEK (BETA)</text>
  <text x="672" y="757" font-size="13" font-weight="700" fill="#102a43">6 signals &#183; 4 stand-downs &#183; avg planned R:R 1 : 2.4</text>
  <text x="1332" y="757" font-size="11" fill="#9bb2c9" text-anchor="end">You decide every trade.</text>
</svg>
