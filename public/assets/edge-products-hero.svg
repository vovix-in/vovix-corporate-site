  <rect x="30" y="92" width="590" height="782" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1" filter="url(#cardshadow)"/>
  <rect x="30" y="92" width="590" height="44" rx="12" fill="#f5f7fa"/>
  <rect x="30" y="120" width="590" height="16" fill="#f5f7fa"/>
  <text x="52" y="117" font-size="10" font-weight="700" letter-spacing="2" fill="#486581">LIVE SIGNAL</text>
  <text x="596" y="117" font-size="10" fill="#00c853" text-anchor="end">&#9679; London session</text>

  <!-- Pair + direction -->
