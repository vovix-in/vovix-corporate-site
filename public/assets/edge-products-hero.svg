    <text x="70" y="427" font-size="15" font-weight="800" fill="#102a43">1.0842</text>
    <rect x="332" y="388" width="262" height="52" rx="8" fill="rgba(16,42,67,0.03)" stroke="#e2e8f0" stroke-width="1"/>
    <text x="346" y="408" font-size="9" fill="#9bb2c9">STOP LOSS</text>
    <text x="346" y="427" font-size="15" font-weight="800" fill="#102a43">1.0818 <tspan font-size="10" font-weight="600" fill="#ef5350">-24 pips</tspan></text>
    <rect x="56" y="450" width="262" height="52" rx="8" fill="rgba(0,200,83,0.05)" stroke="rgba(0,200,83,0.25)" stroke-width="1"/>
