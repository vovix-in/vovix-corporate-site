  <circle cx="0" cy="900" r="320" fill="rgba(0,200,83,0.04)"/>

  <!-- Header bar -->
  <rect x="30" y="28" width="1340" height="52" rx="10" fill="white" stroke="#d9e2ec" stroke-width="1" filter="url(#cardshadow)"/>
  <circle cx="58" cy="54" r="5" fill="#ef5350" fill-opacity="0.7"/>
  <circle cx="76" cy="54" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="94" cy="54" r="5" fill="#00c853" fill-opacity="0.7"/>
