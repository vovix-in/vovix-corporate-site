  <rect x="632" y="92" width="738" height="782" rx="12" fill="white" stroke="#d9e2ec" stroke-width="1" filter="url(#cardshadow)"/>
  <rect x="632" y="92" width="738" height="44" rx="12" fill="#f5f7fa"/>
  <rect x="632" y="120" width="738" height="16" fill="#f5f7fa"/>
  <text x="654" y="117" font-size="10" font-weight="700" letter-spacing="2" fill="#486581">WHY THIS SETUP</text>
  <rect x="1218" y="102" width="134" height="24" rx="12" fill="rgba(0,200,83,0.1)" stroke="rgba(0,200,83,0.3)" stroke-width="1"/>
  <text x="1285" y="118" font-size="10" font-weight="700" fill="#00c853" text-anchor="middle">TRENDING REGIME</text>

