  <g font-size="12">
    <text x="672" y="398" fill="#102a43" font-weight="700">13:30</text>
    <text x="742" y="398" fill="#486581">USD</text>
    <text x="800" y="398" fill="#486581">Core CPI m/m</text>
    <circle cx="1300" cy="393" r="6" fill="#ef5350"/>
    <text x="1318" y="398" fill="#ef5350" font-size="10" font-weight="700" text-anchor="end">High</text>
    <line x1="672" y1="414" x2="1330" y2="414" stroke="#eef2f6"/>

    <text x="672" y="440" fill="#102a43" font-weight="700">15:00</text>
    <text x="742" y="440" fill="#486581">EUR</text>
    <text x="800" y="440" fill="#486581">Flash Manufacturing PMI</text>
    <circle cx="1300" cy="435" r="6" fill="#f59e0b"/>
    <text x="1318" y="440" fill="#c07800" font-size="10" font-weight="700" text-anchor="end">Med</text>
    <line x1="672" y1="456" x2="1330" y2="456" stroke="#eef2f6"/>

    <text x="672" y="482" fill="#102a43" font-weight="700">18:00</text>
    <text x="742" y="482" fill="#486581">USD</text>
    <text x="800" y="482" fill="#486581">FOMC member speaks</text>
    <circle cx="1300" cy="477" r="6" fill="#f59e0b"/>
    <text x="1318" y="482" fill="#c07800" font-size="10" font-weight="700" text-anchor="end">Med</text>
