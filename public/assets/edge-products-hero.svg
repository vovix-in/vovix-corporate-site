  <line x1="56" y1="246" x2="594" y2="246" stroke="#eef2f6" stroke-width="1"/>
  <line x1="56" y1="288" x2="594" y2="288" stroke="#eef2f6" stroke-width="1"/>
  <line x1="56" y1="330" x2="594" y2="330" stroke="#eef2f6" stroke-width="1"/>
  <!-- price path -->
  <polyline points="80,344 130,330 170,336 210,318 250,322 300,300 340,306 380,286 430,278 470,262 520,250 566,236"
