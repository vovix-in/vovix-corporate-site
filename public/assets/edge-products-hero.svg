  <text x="156" y="60" font-size="15" font-weight="700" fill="#00c853"> Edge</text>
  <text x="118" y="73" font-size="10" fill="#486581">AI-assisted signals &#183; MetaTrader 5 &#183; Windows desktop</text>
  <rect x="1058" y="40" width="70" height="24" rx="12" fill="rgba(0,229,255,0.10)" stroke="rgba(0,229,255,0.45)" stroke-width="1"/>
  <text x="1093" y="56" font-size="10" font-weight="700" fill="#0093a8" text-anchor="middle">BETA</text>
  <rect x="1140" y="40" width="160" height="24" rx="12" fill="rgba(0,200,83,0.1)" stroke="rgba(0,200,83,0.4)" stroke-width="1"/>
  <circle cx="1156" cy="52" r="4" fill="#00c853"/>
  <text x="1166" y="56" font-size="10" font-weight="700" fill="#00c853">A+ SIGNALS ONLY</text>

