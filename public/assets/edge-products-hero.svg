  <rect x="238" y="160" width="66" height="28" rx="14" fill="#00c853"/>
  <text x="271" y="179" font-size="13" font-weight="800" fill="#06231a" text-anchor="middle">BUY</text>
  <rect x="316" y="160" width="94" height="28" rx="14" fill="rgba(0,200,83,0.12)" stroke="rgba(0,200,83,0.45)" stroke-width="1"/>
  <text x="363" y="179" font-size="12" font-weight="800" fill="#00a844" text-anchor="middle">A+ SETUP</text>
  <text x="594" y="180" font-size="12" fill="#486581" text-anchor="end">Confidence 87%</text>

