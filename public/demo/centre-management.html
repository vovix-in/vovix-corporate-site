ACT['csv-students'] = () => csv('students.csv', [['Admission no','Student','Batch','Parent','Parent phone','Fee plan','Fee status','Outstanding (INR)','Status'], ...S.students.map(s => [s.adm, sname(s), bat(s.batch).name, par(s.parent).name, par(s.parent).phone, plan(s.plan).name, DS[feeStatusOf(s.id)].l, outstandingOf(s.id), s.status])]);

HV.student = R => {
  const s = stu(R.id); if (!s) return pageH('Student not found', '') + empty('This student does not exist', 'It may have been removed by a demo reset.', 'user');
  const b = bat(s.batch); const p = par(s.parent); const T = todayKey();
  const ds = duesOf(s.id); const pays = payOf(s.id);
  const hist = S.att.filter(r => r.sid === s.id && r.date >= addDays(T, -30)).sort(by(r => r.date, -1));
  const expN = (() => { let n = 0; for (let i = -30; i <= 0; i++){ if (b.days.includes(dow(addDays(T, i))) && addDays(T, i) >= s.joined) n++; } return n; })();
  const att = hist.filter(r => r.drop?.status === 'approved' && !r.absent).length;
  return `<a href="#/head/students" class="small row" style="gap:6px;margin-bottom:10px;text-decoration:none">${ic('back','i-sm')} All students</a>` +
  pageH(`<span class="row" style="gap:12px"><span class="avatar lg ${avc(s.id)}"><i>${initials(sname(s))}</i></span><span>${esc(sname(s))}</span></span>`, `${esc(s.adm)} · ${esc(b.name)} (${esc(b.level)}) · <span class="chip ${s.status === 'active' ? 'ok' : 'neutral'}">${s.status === 'active' ? 'Active' : 'Inactive'}</span>`,
    `<button class="btn" data-act="stu-toggle" data-id="${s.id}">${s.status === 'active' ? 'Mark inactive' : 'Reactivate'}</button><button class="btn" data-act="stu-edit" data-id="${s.id}">${ic('edit','i-sm')} Edit</button><button class="btn primary" data-act="pay-open" data-sid="${s.id}" data-tour="record-pay" ${openDues(s.id).length ? '' : 'disabled'}>${ic('rupee','i-sm')} Record payment</button>`) +
  `<div class="grid g3">
    <section class="card"><div class="card-h"><h2>Details</h2></div><div class="card-b"><dl class="kv"><dt>Date of birth</dt><dd>${fmtKey(s.dob)} (${ageOf(s.dob)})</dd><dt>Gender</dt><dd>${s.gender === 'M' ? 'Boy' : 'Girl'}</dd><dt>Joined</dt><dd>${fmtKey(s.joined)}</dd><dt>Batch</dt><dd>${esc(b.name)}<br><span class="muted small">${b.days.map(d => DOW[d]).join(', ')} · ${fmtHM(b.start)}–${fmtHM(b.end)}</span></dd><dt>Fee plan</dt><dd>${esc(plan(s.plan).name)} · ${inr(plan(s.plan).amount)}</dd><dt>Discount</dt><dd>${s.discount ? inr(s.discount) + ' per due' : 'None'}</dd></dl></div></section>
    <section class="card"><div class="card-h"><h2>Parent &amp; guardians</h2><button class="btn sm" data-act="g-add" data-sid="${s.id}">${ic('plus','i-sm')} Add</button></div><div class="card-b"><dl class="kv" style="margin-bottom:10px"><dt>Parent account</dt><dd>${esc(p.name)} (${esc(p.rel)})</dd><dt>Phone</dt><dd>${esc(p.phone)}</dd><dt>Email</dt><dd>${esc(p.email)}</dd>${p.children.length > 1 ? `<dt>Siblings</dt><dd>${p.children.filter(c => c !== s.id).map(c => `<a href="#/head/student/${c}">${esc(stu(c).first)}</a>`).join(', ')}</dd>` : ''}</dl>
      <div class="label" style="margin-bottom:4px">Authorised for pickup</div><ul class="list">${s.guardians.map(g => `<li><span class="avatar ${avc(g.id)}"><i>${initials(g.name)}</i></span><div class="grow"><div class="cell-main">${esc(g.name)} ${g.primary ? '<span class="chip ok">Primary</span>' : ''}</div><div class="cell-sub">${esc(g.rel)} · ${esc(g.phone)}</div></div>${g.primary ? '' : `<button class="icon-btn" data-act="g-del" data-sid="${s.id}" data-gid="${g.id}" aria-label="Remove ${esc(g.name)}">${ic('x','i-sm')}</button>`}</li>`).join('')}</ul></div></section>
    <section class="card"><div class="card-h"><h2>Attendance (30 days)</h2><span class="chip ${expN && att / expN >= .8 ? 'ok' : 'warn'}">${expN ? Math.round(100 * Math.min(att, expN) / expN) : 0}%</span></div><div class="card-b">
      <div class="small muted" style="margin-bottom:8px">${att} of ${expN} scheduled sessions attended</div>
      ${hist.length ? `<ul class="list">${hist.slice(0, 8).map(r => `<li><div class="grow"><div class="small" style="font-weight:600">${fmtDow(r.date)}</div><div class="cell-sub">${r.drop ? 'In ' + fmtTime(r.drop.ts) : ''}${r.pick?.status === 'approved' ? ' · Out ' + fmtTime(r.pick.ts) : ''}</div></div>${chipSt(stOf(r))}<button class="icon-btn" data-act="rec-view" data-id="${r.id}" aria-label="View record">${ic('chev','i-sm')}</button></li>`).join('')}</ul>` : empty('No attendance yet', 'Records appear after the first class.', 'cal')}</div></section>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <section class="card"><div class="card-h"><h2>Fee account</h2><span class="small">Outstanding <b>${inr(outstandingOf(s.id))}</b></span></div><div class="table-wrap"><table class="t responsive"><thead><tr><th>Period</th><th>Due date</th><th class="num">Net</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>
      ${ds.map(d => `<tr><td class="primary-cell"><div class="cell-main">${esc(d.label)}</div>${d.discount ? `<div class="cell-sub">${inr(d.amount)} − ${inr(d.discount)} ${esc(d.discNote || 'discount')}</div>` : ''}</td><td data-l="Due">${fmtKey(d.due)}</td><td class="num" data-l="Net">${inr(netOf(d))}</td><td class="num" data-l="Paid">${inr(paidOf(d))}</td><td class="num" data-l="Balance"><b>${inr(balOf(d))}</b></td><td data-l="Status">${chipDue(d)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="card"><div class="card-h"><h2>Payment history</h2></div><div class="card-b">${pays.length ? `<ul class="list">${pays.map(p => `<li><span class="act-ic ${p.void ? 'crit' : 'ok'}">${ic('receipt','i-sm')}</span><div class="grow"><div class="cell-main">${inr(p.amount)} <span class="muted small">· ${esc(p.method)}</span> ${p.void ? '<span class="chip crit">Void</span>' : ''}</div><div class="cell-sub mono">${esc(p.no)}</div><div class="cell-sub">${fmtDate(p.ts)} · ${esc(S.dues.find(d => d.id === p.dueId)?.label || '')}</div></div><button class="btn sm" data-act="rcpt-open" data-id="${p.id}">View</button></li>`).join('')}</ul>` : empty('No payments yet', 'Recorded payments and receipts appear here.', 'receipt')}</div></section>
  </div>`;
};
ACT['stu-toggle'] = async el => { const s = stu(el.dataset.id); const toIn = s.status === 'active'; if (!(await confirmBox({ title: toIn ? `Mark ${esc(s.first)} inactive?` : `Reactivate ${esc(s.first)}?`, text: toIn ? 'Inactive students are not expected in class, and the parent cannot request attendance. Fee history is kept.' : 'The student will appear in batch lists again.', ok: toIn ? 'Mark inactive' : 'Reactivate', danger:toIn }))) return; s.status = toIn ? 'inactive' : 'active'; audit(S.head.name, `${toIn ? 'Deactivated' : 'Reactivated'} ${sname(s)}`, toIn ? 'warn' : 'ok'); save(); toast(`${s.first} is now ${s.status}.`); render(false); };
ACT['g-del'] = async el => { const s = stu(el.dataset.sid); const g = guardian(s, el.dataset.gid); if (!(await confirmBox({ title:'Remove authorised guardian?', text:`${esc(g.name)} will no longer be allowed to collect ${esc(s.first)}.`, ok:'Remove', danger:true }))) return; s.guardians = s.guardians.filter(x => x.id !== g.id); audit(S.head.name, `Removed ${g.name} from ${sname(s)}'s pickup list`, 'warn'); save(); toast('Guardian removed.'); render(false); };
ACT['g-add'] = el => { const s = stu(el.dataset.sid); openModal({ title:`Add authorised guardian — ${esc(s.first)}`, mw:480, onSubmit:fd => { if (!fd.name.trim()) fail('Enter the guardian’s name.'); if (!/^[0-9+\s-]{10,15}$/.test(fd.phone.trim())) fail('Enter a valid 10-digit mobile number.'); const d = fd.phone.replace(/\D/g, '').slice(-10); s.guardians.push({ id:uid('g'), name:fd.name.trim(), rel:fd.rel, phone:`+91 ${d.slice(0,2)}XXX XX${d.slice(-3)}` }); audit(S.head.name, `Added ${fd.name.trim()} (${fd.rel}) to ${sname(s)}'s pickup list`, 'ok'); save(); toast('Guardian added to the pickup list.'); render(false); },
  body:`<div class="form-grid"><label class="field full"><span>Full name</span><input class="input" name="name" required autocomplete="off"></label><label class="field"><span>Relationship</span><select class="input" name="rel">${['Grandmother','Grandfather','Aunt','Uncle','Father','Mother','Driver','Neighbour'].map(x => `<option>${x}</option>`).join('')}</select></label><label class="field"><span>Mobile number</span><input class="input" name="phone" inputmode="tel" placeholder="98XXXXXXXX" required><small>Stored masked in this demo</small></label></div>`,
  foot:`<button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">Add guardian</button>` }); };
ACT['stu-edit'] = el => {
  const s = el.dataset.id ? stu(el.dataset.id) : null;
  openModal({ title: s ? `Edit ${esc(sname(s))}` : 'Add student', sub: s ? '' : 'Admission number is generated automatically.', mw:640,
    onSubmit:fd => {
      if (!fd.first.trim() || !fd.last.trim()) fail('Enter the student’s first and last name.');
      if (!fd.dob) fail('Enter date of birth.');
      if (fd.dob >= todayKey()) fail('Date of birth must be in the past.');
      const disc = +fd.discount || 0; if (disc < 0 || disc >= plan(fd.plan).amount) fail('Discount must be less than the plan amount.');
      let pid = fd.parent;
      if (!s && pid === '__new'){
        if (!fd.pname.trim()) fail('Enter the parent’s name.');
        const d = (fd.pphone || '').replace(/\D/g, ''); if (d.length < 10) fail('Enter the parent’s 10-digit mobile number.');
        pid = uid('p'); S.parents.push({ id:pid, name:fd.pname.trim(), rel:fd.prel, phone:`+91 ${d.slice(-10,-8)}XXX XX${d.slice(-3)}`, email:fd.pemail.trim() || '—', children:[], prefs:{ inapp:true, wa:true, email:false } });
      }
      if (s){
        Object.assign(s, { first:fd.first.trim(), last:fd.last.trim(), gender:fd.gender, dob:fd.dob, batch:fd.batch, plan:fd.plan, discount:disc });
        audit(S.head.name, `Updated student ${sname(s)}`, 'info'); save(); toast('Student details saved.'); render(false); return true;
      }
      const P = par(pid); const id = uid('s'); const max = Math.max(...S.students.map(x => +x.adm.split('-')[1]));
      const ns = { id, adm:`PGC-${max + 1}`, first:fd.first.trim(), last:fd.last.trim(), gender:fd.gender, dob:fd.dob, batch:fd.batch, plan:fd.plan, discount:disc, parent:pid, guardians:[{ id:id + 'g1', name:P.name, rel:P.rel, phone:P.phone, primary:true }], status:'active', joined:todayKey(), notes:'' };
      S.students.push(ns); P.children.push(id);
      const pl = plan(fd.plan); const T = todayKey(); const t0 = ist(now());
      const nd = new Date(Date.UTC(t0.getUTCFullYear(), t0.getUTCMonth() + (t0.getUTCDate() > 5 ? 1 : 0), 5));
      S.dues.push({ id:uid('d'), sid:id, plan:pl.id, label: pl.cycle === 'monthly' ? `${MON[nd.getUTCMonth()]} ${nd.getUTCFullYear()}` : `Admission term`, due: pl.cycle === 'monthly' ? dkey(nd.getTime()) : addDays(T, 7), amount:pl.amount, discount:disc, discNote: disc ? 'Discount' : '' });
      audit(S.head.name, `Admitted ${sname(ns)} (${ns.adm}) to ${bat(ns.batch).name}`, 'ok'); save(); toast(`${ns.first} admitted as ${ns.adm}. First fee due created.`); go('#/head/student/' + id); return true;
    },
    onOpen:m => { const sel = m.querySelector('[name=parent]'); const box = m.querySelector('#newParent'); if (sel) { const up = () => box.hidden = sel.value !== '__new'; sel.addEventListener('change', up); up(); } },
    body:`<div class="form-grid">
      <label class="field"><span>First name</span><input class="input" name="first" value="${esc(s?.first || '')}" required autocomplete="off"></label>
      <label class="field"><span>Last name</span><input class="input" name="last" value="${esc(s?.last || '')}" required autocomplete="off"></label>
      <label class="field"><span>Gender</span><select class="input" name="gender"><option value="M" ${s?.gender === 'M' ? 'selected' : ''}>Boy</option><option value="F" ${s?.gender === 'F' ? 'selected' : ''}>Girl</option></select></label>
      <label class="field"><span>Date of birth</span><input class="input" type="date" name="dob" value="${s?.dob || ''}" max="${todayKey()}" required></label>
      <label class="field"><span>Batch</span><select class="input" name="batch">${S.batches.map(b => `<option value="${b.id}" ${s?.batch === b.id ? 'selected' : ''}>${esc(b.name)} (${esc(b.level)})</option>`).join('')}</select></label>
      <label class="field"><span>Fee plan</span><select class="input" name="plan">${S.plans.map(p => `<option value="${p.id}" ${s?.plan === p.id ? 'selected' : ''}>${esc(p.name)} — ${inr(p.amount)}</option>`).join('')}</select></label>
      <label class="field"><span>Discount per due (₹)</span><input class="input" type="number" min="0" step="50" name="discount" value="${s?.discount || 0}"></label>
      ${s ? `<div class="field"><span>Parent</span><div class="input" style="background:var(--bg)">${esc(par(s.parent).name)}</div></div>` : `<label class="field"><span>Parent account</span><select class="input" name="parent"><option value="__new">+ New parent</option>${S.parents.slice().sort(by(p => p.name)).map(p => `<option value="${p.id}">${esc(p.name)} (${p.children.length} child${p.children.length > 1 ? 'ren' : ''})</option>`).join('')}</select></label>
      <div class="full" id="newParent"><div class="form-grid" style="background:var(--bg);padding:14px;border-radius:12px"><label class="field"><span>Parent name</span><input class="input" name="pname" autocomplete="off"></label><label class="field"><span>Relationship</span><select class="input" name="prel"><option>Mother</option><option>Father</option><option>Guardian</option></select></label><label class="field"><span>Mobile number</span><input class="input" name="pphone" inputmode="tel" placeholder="98XXXXXXXX"></label><label class="field"><span>Email <small>(for password recovery)</small></span><input class="input" type="email" name="pemail" placeholder="name@example.com"></label><div class="full small muted">${ic('lock','i-sm')} In the product, the Centre Head issues a login with a temporary password. No SMS OTP is used.</div></div></div>`}
    </div>`,
    foot:`<button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">${s ? 'Save changes' : 'Admit student'}</button>` });
};

/* ---------- batches ---------- */
HV.batches = () => {
  const T = todayKey();
  return pageH('Batches', `${S.batches.length} batches · classes in IST`, `<button class="btn primary" data-act="batch-edit">${ic('plus','i-sm')} Create batch</button>`) +
  `<div class="grid g3">${S.batches.map(b => { const n = S.students.filter(s => s.batch === b.id && s.status === 'active').length; const today = b.days.includes(dow(T)); return `<button type="button" class="card batch-card" data-act="batch-view" data-id="${b.id}">
    <div class="row between" style="width:100%"><div><div class="cell-main" style="font-size:16px">${esc(b.name)}</div><div class="cell-sub">${esc(b.level)} · ${esc(b.room)}</div></div>${today ? '<span class="chip ok">Today</span>' : ''}</div>
    ${daysHtml(b)}
    <div class="row small ink2" style="gap:14px;flex-wrap:wrap"><span class="row" style="gap:5px">${ic('clock','i-sm')}${fmtHM(b.start)} – ${fmtHM(b.end)}</span><span class="row" style="gap:5px">${ic('user','i-sm')}${esc(stf(b.staffId)?.name || 'Unassigned')}</span><span class="row" style="gap:5px">${ic('users','i-sm')}${n} students</span></div></button>`; }).join('')}</div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>Today’s schedule — ${fmtDow(T)}</h2></div><div class="card-b">${(() => { const tb = S.batches.filter(b => b.days.includes(dow(T))).sort(by(b => b.start)); return tb.length ? `<div class="table-wrap"><table class="t responsive"><thead><tr><th>Time</th><th>Batch</th><th>Staff</th><th class="num">Present / expected</th></tr></thead><tbody>${tb.map(b => { const ex = expectedOn(T).filter(s => s.batch === b.id); const pr = ex.filter(s => ['present','pick_pending','picked'].includes(stOf(recOf(s.id, T)))).length; return `<tr><td class="primary-cell"><b>${fmtHM(b.start)} – ${fmtHM(b.end)}</b></td><td data-l="Batch">${esc(b.name)}</td><td data-l="Staff">${esc(stf(b.staffId)?.name || '—')}</td><td class="num" data-l="Present">${pr} / ${ex.length}</td></tr>`; }).join('')}</tbody></table></div>` : empty('No classes today', 'No batch is scheduled for today.', 'cal'); })()}</div></section>`;
};
ACT['batch-view'] = el => {
  const b = bat(el.dataset.id); const list = S.students.filter(s => s.batch === b.id).sort(by(s => sname(s))); const T = todayKey();
  openModal({ title:esc(b.name), sub:`${esc(b.level)} · ${b.days.map(d => DOW[d]).join(', ')} · ${fmtHM(b.start)}–${fmtHM(b.end)} · ${esc(stf(b.staffId)?.name || 'Unassigned')}`, mw:620,
    body:`<ul class="list">${list.map(s => `<li><span class="avatar ${avc(s.id)}"><i>${initials(sname(s))}</i></span><div class="grow"><a class="cell-main" href="#/head/student/${s.id}">${esc(sname(s))}</a><div class="cell-sub">${esc(s.adm)} · ${esc(par(s.parent).name)}</div></div>${s.status === 'active' ? (b.days.includes(dow(T)) ? chipSt(stOf(recOf(s.id, T))) : '') : '<span class="chip neutral">Inactive</span>'}</li>`).join('')}</ul>`,
    foot:`<button type="button" class="btn" data-act="modal-close">Close</button><button type="button" class="btn primary" data-act="batch-edit" data-id="${b.id}">${ic('edit','i-sm')} Edit batch</button>` });
};
ACT['batch-edit'] = el => {
  const b = el.dataset.id ? bat(el.dataset.id) : null;
  openModal({ title: b ? `Edit ${esc(b.name)}` : 'Create batch', mw:560,
    onSubmit:(fd, form) => {
      const days = $$('input[name=day]:checked', form).map(x => +x.value);
      if (!fd.name.trim()) fail('Enter a batch name.'); if (!days.length) fail('Choose at least one class day.'); if (fd.end <= fd.start) fail('End time must be after start time.');
      const data = { name:fd.name.trim(), level:fd.level.trim() || '—', days, start:fd.start, end:fd.end, staffId:fd.staffId, room:fd.room.trim() || '—' };
      if (b) Object.assign(b, data); else S.batches.push({ id:uid('b'), ...data });
      audit(S.head.name, `${b ? 'Updated' : 'Created'} batch ${data.name}`, 'info'); save(); toast(b ? 'Batch updated.' : 'Batch created.'); render(false);
    },
    body:`<div class="form-grid"><label class="field"><span>Batch name</span><input class="input" name="name" value="${esc(b?.name || '')}" required></label><label class="field"><span>Level / age group</span><input class="input" name="level" value="${esc(b?.level || '')}" placeholder="Ages 5–6"></label>
      <fieldset class="field full" style="border:0;padding:0;margin:0"><legend class="small" style="font-weight:600;color:var(--ink-2);margin-bottom:6px">Class days</legend><div class="row wrap">${[1,2,3,4,5,6,0].map(d => `<label class="check" style="border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px"><input type="checkbox" name="day" value="${d}" ${b?.days.includes(d) ? 'checked' : ''}>${DOW[d]}</label>`).join('')}</div></fieldset>
      <label class="field"><span>Start time</span><input class="input" type="time" name="start" value="${b?.start || '16:00'}" required></label><label class="field"><span>End time</span><input class="input" type="time" name="end" value="${b?.end || '17:00'}" required></label>
      <label class="field"><span>Assigned staff</span><select class="input" name="staffId">${S.staff.filter(x => x.active).map(x => `<option value="${x.id}" ${b?.staffId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>Room</span><input class="input" name="room" value="${esc(b?.room || '')}"></label></div>`,
    foot:`<button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">${b ? 'Save batch' : 'Create batch'}</button>` });
};
</script>
<script>
'use strict';
/* ---------- payments & receipts ---------- */
ACT['pay-open'] = el => {
  const a = actor(); if (!canSeeFees(a)) fail('You do not have permission to record payments.');
  const sid0 = el.dataset.sid || ''; const due0 = el.dataset.due || '';
  const candidates = S.students.filter(s => openDues(s.id).length).sort(by(s => sname(s)));
  const first = sid0 || candidates[0]?.id; if (!first) fail('There are no open dues to collect.');
  const dueOpts = sid => openDues(sid).map(d => `<option value="${d.id}" ${d.id === due0 ? 'selected' : ''}>${esc(d.label)} — balance ${inr(balOf(d))}${dueSt(d) === 'overdue' ? ' (overdue)' : ''}</option>`).join('');
  openModal({ title:'Record payment', sub:'Payment is recorded only. No money moves in this demo.', mw:600,
    onSubmit:fd => { const p = A.recordPayment(fd, a); if (!p){ toast('Discount applied.'); softRefresh(); return true; } setTimeout(() => openReceipt(p.id, true), 0); softRefresh(); return true; },
    onOpen:m => {
      const sSel = m.querySelector('[name=sid]'), dSel = m.querySelector('[name=dueId]'), amt = m.querySelector('[name=amount]'), sumBox = m.querySelector('#paySum'), refF = m.querySelector('#refField'), disc = m.querySelector('[name=discount]');
      const upd = () => { const d = S.dues.find(x => x.id === dSel.value); if (!d) return; const ds = +disc.value || 0; amt.value = Math.max(0, balOf(d) - ds); amt.max = Math.max(0, balOf(d) - ds); sumBox.innerHTML = `<dl class="kv"><dt>Fee</dt><dd>${inr(d.amount)}${d.discount ? ` − ${inr(d.discount)} discount` : ''}</dd><dt>Already paid</dt><dd>${inr(paidOf(d))}</dd><dt>Balance</dt><dd>${inr(balOf(d))} · due ${fmtKey(d.due)} ${chipDue(d)}</dd></dl>`; };
      sSel?.addEventListener('change', () => { dSel.innerHTML = dueOpts(sSel.value); upd(); });
      dSel.addEventListener('change', upd); disc.addEventListener('input', upd);
      const meth = () => { const v = m.querySelector('[name=method]:checked').value; refF.hidden = v === 'Cash'; refF.querySelector('span').textContent = v === 'UPI' ? 'UPI transaction ID' : 'Bank UTR / reference'; };
      $$('[name=method]', m).forEach(x => x.addEventListener('change', meth)); meth(); upd();
    },
    body:`<div class="form-grid">

function repData(){
  const T = todayKey(); const from = F('repFrom', addDays(T, -29)); const to = F('repTo', T); const fb = F('repB'); const tab = F('repTab', 'daily');
  const inB = s => !fb || s.batch === fb;
  const dates = []; for (let k = from; k <= to; k = addDays(k, 1)) { dates.push(k); if (dates.length > 400) break; }
  const recsIn = S.att.filter(r => r.date >= from && r.date <= to && inB(stu(r.sid)));
  const attended = r => r.drop?.status === 'approved' && !r.absent;
  if (tab === 'daily'){
    const rows = dates.map(k => { const exp = expectedOn(k).filter(inB).length; const rs = recsIn.filter(r => r.date === k); const pr = rs.filter(attended).length; return [fmtDow(k), exp, pr, Math.max(0, exp - pr), rs.filter(r => r.pick?.status === 'approved').length, rs.filter(isMissed).length, exp ? Math.round(100 * pr / exp) + '%' : '—']; }).filter(r => r[1] || r[2]);
    const e = sum(rows, r => r[1]), p = sum(rows, r => r[2]);
    return { title:'Daily attendance', cols:['Date','Expected','Present','Absent','Picked up','Missed checkout','Attendance %'], num:[1,2,3,4,5,6], rows, total:['Total', e, p, sum(rows, r => r[3]), sum(rows, r => r[4]), sum(rows, r => r[5]), e ? Math.round(100 * p / e) + '%' : '—'] };
  }
  if (tab === 'student'){
    const rows = S.students.filter(s => s.status === 'active' && inB(s)).map(s => { const exp = dates.filter(k => scheduledOn(s, k) && k >= s.joined).length; const at = recsIn.filter(r => r.sid === s.id && attended(r)).length; return [sname(s), s.adm, bat(s.batch).name, exp, at, exp ? Math.round(100 * Math.min(at, exp) / exp) + '%' : '—', recsIn.filter(r => r.sid === s.id && isMissed(r)).length]; }).sort(by(r => r[0]));
    return { title:'Student attendance', cols:['Student','Admission no','Batch','Sessions scheduled','Attended','Attendance %','Missed checkouts'], num:[3,4,5,6], rows };
  }
  if (tab === 'batch'){
    const rows = S.batches.filter(b => !fb || b.id === fb).map(b => { const ses = dates.filter(k => b.days.includes(dow(k))); const exp = sum(ses, k => expectedOn(k).filter(s => s.batch === b.id).length); const at = recsIn.filter(r => stu(r.sid).batch === b.id && attended(r)).length; return [b.name, stf(b.staffId)?.name || '—', ses.length, exp, at, exp ? Math.round(100 * at / exp) + '%' : '—']; });
    return { title:'Batch-wise attendance', cols:['Batch','Staff','Sessions held','Expected student-sessions','Attended','Attendance %'], num:[2,3,4,5], rows };
  }
  if (tab === 'collection'){
    const ps = S.payments.filter(p => !p.void && dkey(p.ts) >= from && dkey(p.ts) <= to && inB(stu(p.sid)));
    const months = [...new Set(ps.map(p => dkey(p.ts).slice(0, 7)))].sort();
    const rows = months.map(m => { const x = ps.filter(p => dkey(p.ts).startsWith(m)); const t = me => sum(x.filter(p => p.method === me), p => p.amount); return [`${MON[+m.slice(5) - 1]} ${m.slice(0, 4)}`, x.length, inr(t('Cash')), inr(t('UPI')), inr(t('Bank transfer')), inr(sum(x, p => p.amount))]; });
    const t = me => sum(ps.filter(p => p.method === me), p => p.amount);
    return { title:'Monthly collection', cols:['Month','Receipts','Cash','UPI','Bank transfer','Total'], num:[1,2,3,4,5], rows, total:['Total', ps.length, inr(t('Cash')), inr(t('UPI')), inr(t('Bank transfer')), inr(sum(ps, p => p.amount))], raw:ps };
  }
  const rows = S.students.filter(s => inB(s)).map(s => { const ds = duesOf(s.id); const od = ds.filter(d => d.due <= T && balOf(d) > 0); const up = ds.filter(d => d.due > T && balOf(d) > 0); return [sname(s), bat(s.batch).name, par(s.parent).name, od[0] ? fmtKey(od[0].due) : '—', sum(od, balOf), sum(up, balOf), sum(od, balOf) + sum(up, balOf)]; }).filter(r => r[6] > 0).sort(by(r => r[4], -1));
  return { title:'Outstanding fees', cols:['Student','Batch','Parent','Oldest unpaid due','Due now (₹)','Upcoming (₹)','Total (₹)'], num:[4,5,6], rows, total:['Total','','','', sum(rows, r => r[4]), sum(rows, r => r[5]), sum(rows, r => r[6])], money:[4,5,6] };
}

  return pageH('Reports', 'Filter by date range and batch. Export any report to CSV.', `<button class="btn primary" data-act="rep-csv">${ic('download','i-sm')} Export CSV</button>`) +

  </div>`;
};

    ${modeA ? `<div class="action-row"><button class="btn ${canDrop ? 'primary' : ''} lg" data-act="p-drop" data-tour="drop" ${canDrop ? '' : 'disabled'}>${ic('login')} Drop-off</button><button class="btn ${canPick ? 'primary' : ''} lg" data-act="p-pick" data-tour="pick" ${canPick ? '' : 'disabled'}>${ic('home')} Pick-up</button></div>
    <div class="row between xs muted" style="margin-top:6px"><span>${dropWhy}</span><span>${pickWhy}</span></div>${!sched && canDrop ? `<div class="note info" style="margin-top:10px">${ic('info')}<div>Not a scheduled class day. A drop-off today is recorded as a make-up session.</div></div>` : ''}`
    : `<div class="note ok" style="margin-top:14px">${ic('shield')}<div>Your centre confirms drop-off and pickup at the door. This screen updates as soon as staff record it.</div></div>`}
    ${rec ? `<hr class="sep">${recTimeline(rec)}` : ''}</section>
  ${due ? `<section class="card fee-card" style="margin-top:14px" data-act="go" data-href="#/parent/fees" role="button" tabindex="0"><span class="status-ic ${dueSt(due) === 'overdue' ? 'crit' : 'warn'}">${ic('rupee')}</span><div class="grow"><div class="small muted">${dueSt(due) === 'overdue' ? 'Overdue' : 'Upcoming fee'} · ${esc(due.label)}</div><b class="amt">${inr(balOf(due))}</b><div class="small ink2">Due ${fmtKey(due.due)} ${chipDue(due)}</div></div>${ic('chev')}</section>` : `<section class="card fee-card" style="margin-top:14px"><span class="status-ic ok">${ic('check')}</span><div><b>All fees paid</b><div class="small muted">No dues for ${esc(s.first)}.</div></div></section>`}
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Notifications</h2><span class="chip neutral">In-app</span></div><div class="card-b">${feed.length ? `<ul class="list">${feed.map(x => `<li><span class="act-ic ${x.k}">${ic(x.k === 'ok' ? 'check' : x.k === 'crit' ? 'alert' : x.k === 'warn' ? 'bell' : 'home','i-sm')}</span><div class="grow"><div class="small" style="font-weight:600">${esc(x.t)}</div><div class="cell-sub">${relTime(x.ts)}</div></div></li>`).join('')}</ul>` : empty('No notifications', 'Updates from the centre appear here.', 'bell')}</div></section>`;
};
ACT['p-drop'] = () => { const s = stu(S.ui.childId); A.parentDrop(s.id, actor()); toast(`Drop-off request sent for ${s.first}. Waiting for the centre to confirm.`); render(false); };
ACT['p-pick'] = () => {
  const s = stu(S.ui.childId);
  openModal({ title:`Pick up ${esc(s.first)}`, sub:'Choose who is collecting today. Staff will verify them at the desk.', mw:460,
    onSubmit:fd => { A.parentPick(s.id, fd.gid, actor()); toast(`Pickup request sent. ${guardian(s, fd.gid).name} will be verified at the desk.`); render(false); },
    body:`<div class="stack">${s.guardians.map((g, i) => `<label class="radio-card"><input type="radio" name="gid" value="${g.id}" ${i === 0 ? 'checked' : ''}><div class="grow"><div class="cell-main">${esc(g.name)}</div><div class="cell-sub">${esc(g.rel)} · ${esc(g.phone)}</div></div></label>`).join('')}<p class="small muted" style="margin:0">Only authorised guardians are listed. To add someone, contact the centre.</p></div>`,
    foot:`<button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">Request pickup</button>` });
};
PV.attendance = (R, P, s) => {
  const T = todayKey(); const b = bat(s.batch); const rows = [];
  for (let i = 0; i >= -30; i--){ const k = addDays(T, i); const rec = recOf(s.id, k); if (rec || (b.days.includes(dow(k)) && k >= s.joined && k < T)) rows.push([k, rec]); }
  const att = rows.filter(([, r]) => r && r.drop?.status === 'approved' && !r.absent).length; const exp = rows.filter(([k]) => b.days.includes(dow(k)) && k < T).length;
  return `<section class="card" style="padding:16px 18px"><div class="row between"><div><div class="label">Last 30 days</div><b style="font-size:24px">${exp ? Math.round(100 * Math.min(att, exp) / exp) : 0}%</b> <span class="small muted">${att} of ${exp} classes</span></div><span class="status-ic ok">${ic('chart')}</span></div></section>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>History</h2><span class="small muted">Times in IST</span></div><div class="card-b"><ul class="list">${rows.map(([k, r]) => { const st = r ? stOf(r) : 'absent'; return `<li style="align-items:flex-start"><div style="width:48px;text-align:center;flex:none"><div class="xs muted">${DOW[dow(k)]}</div><b>${Number(k.slice(8))}</b><div class="xs muted">${MON[+k.slice(5,7) - 1]}</div></div><div class="grow">${chipSt(st)}${r ? `<div class="cell-sub" style="margin-top:4px">${r.drop ? `Drop-off ${fmtTime(r.drop.ts)}${r.drop.dts ? ` · ${r.drop.status} ${fmtTime(r.drop.dts)}` : ' · pending'}` : ''}${r.drop?.reason ? `<br>Reason: ${esc(r.drop.reason)}` : ''}${r.pick ? `<br>Pickup ${fmtTime(r.pick.ts)} · ${esc(guardian(s, r.pick.gid)?.name)}${r.pick.status !== 'approved' ? ' · ' + r.pick.status : ''}` : ''}${r.corrections.length ? '<br><span class="chip warn" style="margin-top:4px">Corrected by centre</span>' : ''}</div>` : '<div class="cell-sub" style="margin-top:4px">No attendance recorded</div>'}</div></li>`; }).join('')}</ul></div></section>`;
};
PV.fees = (R, P, s) => {
  const ds = duesOf(s.id).slice().reverse(); const pays = payOf(s.id); const out = outstandingOf(s.id); const up = upcomingOf(s.id);
  return `<div class="grid g2" data-tour="p-fees"><section class="card kpi"><span class="label">Outstanding</span><b style="color:${out ? 'var(--crit)' : 'var(--green-ink)'}">${inr(out)}</b><span class="sub">${out ? 'Already due' : 'Nothing overdue'}</span></section><section class="card kpi"><span class="label">Upcoming</span><b>${inr(sum(up, balOf))}</b><span class="sub">${up[0] ? 'Next due ' + fmtKey(up[0].due) : 'No upcoming dues'}</span></section></div>
  <div class="note info" style="margin-top:14px">${ic('info')}<div>Pay at the centre by cash or UPI. Receipts appear here straight away. Online payment is a future option.</div></div>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Fee dues</h2></div><div class="card-b"><ul class="list">${ds.map(d => `<li><div class="grow"><div class="cell-main">${esc(d.label)}</div><div class="cell-sub">Due ${fmtKey(d.due)} · ${inr(netOf(d))}${d.discount ? ` (after ${inr(d.discount)} ${esc(d.discNote || 'discount')})` : ''}</div></div><div style="text-align:right">${chipDue(d)}${balOf(d) ? `<div class="small" style="margin-top:4px"><b>${inr(balOf(d))}</b> left</div>` : ''}</div></li>`).join('')}</ul></div></section>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Payments &amp; receipts</h2></div><div class="card-b">${pays.length ? `<ul class="list">${pays.map(p => `<li><span class="act-ic ${p.void ? 'crit' : 'ok'}">${ic('receipt','i-sm')}</span><div class="grow"><div class="cell-main">${inr(p.amount)} ${p.void ? '<span class="chip crit">Cancelled</span>' : ''}</div><div class="cell-sub">${fmtDate(p.ts)} · ${esc(p.method)} · <span class="mono">${esc(p.no)}</span></div></div><button class="btn sm" data-act="rcpt-open" data-id="${p.id}">${ic('download','i-sm')} Receipt</button></li>`).join('')}</ul>` : empty('No payments yet', 'Receipts appear here after you pay at the centre.', 'receipt')}</div></section>`;
};
PV.children = (R, P) => `<div class="stack">${P.children.map(c => { const s = stu(c); const b = bat(s.batch); const st = stOf(recOf(c, todayKey())); return `<button type="button" class="card" style="width:100%;text-align:left;padding:16px 18px;cursor:pointer;font:inherit;color:inherit;${c === S.ui.childId ? 'border-color:var(--green-ink)' : ''}" data-act="kid-go" data-id="${c}"><div class="row"><span class="avatar lg ${avc(c)}"><i>${initials(sname(s))}</i></span><div class="grow"><div class="cell-main" style="font-size:16px">${esc(sname(s))}</div><div class="cell-sub">${esc(s.adm)} · ${esc(b.name)}</div><div class="cell-sub">${b.days.map(d => DOW[d]).join(', ')} · ${fmtHM(b.start)}–${fmtHM(b.end)}</div><div style="margin-top:6px">${chipSt(st)} ${outstandingOf(c) ? `<span class="chip crit">${inr(outstandingOf(c))} due</span>` : ''}</div></div>${ic('chev')}</div></button>`; }).join('')}
  ${P.children.length < 2 ? `<div class="note info">${ic('info')}<div>Parents with more than one child at the centre can switch between them here. Try <b>Priya Raman</b> in Profile → Demo account.</div></div>` : ''}</div>`;
ACT['kid-go'] = el => { S.ui.childId = el.dataset.id; save(); go('#/parent/home'); };
PV.profile = (R, P) => `<section class="card"><div class="card-b"><div class="row"><span class="avatar lg ${avc(P.id)}"><i>${initials(P.name)}</i></span><div><div class="cell-main" style="font-size:17px">${esc(P.name)}</div><div class="cell-sub">${esc(P.rel)} · ${esc(P.phone)}</div><div class="cell-sub">${esc(P.email)}</div></div></div></div></section>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Authorised pickup persons</h2></div><div class="card-b">${P.children.map(c => { const s = stu(c); return `<div class="label" style="margin:6px 0 2px">${esc(s.first)}</div><ul class="list">${s.guardians.map(g => `<li><span class="avatar ${avc(g.id)}"><i>${initials(g.name)}</i></span><div class="grow"><div class="cell-main">${esc(g.name)}</div><div class="cell-sub">${esc(g.rel)} · ${esc(g.phone)}</div></div>${g.primary ? '<span class="chip ok">You</span>' : ''}</li>`).join('')}</ul>`; }).join('')}<p class="small muted" style="margin:8px 0 0">For safety, only the centre can change this list.</p></div></section>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Notifications</h2></div><div class="card-b">
    <label class="switch"><span><b>In-app notifications</b><br><span class="small muted">Attendance and fee updates</span></span><input type="checkbox" data-chg="pref" data-k="inapp" ${P.prefs.inapp ? 'checked' : ''}></label>
    <label class="switch"><span><b>WhatsApp messages</b> <span class="chip warn">Phase 2</span><br><span class="small muted">Fee reminders and receipts</span></span><input type="checkbox" data-chg="pref" data-k="wa" ${P.prefs.wa ? 'checked' : ''}></label>
    <label class="switch"><span><b>Email</b><br><span class="small muted">Password recovery always uses email</span></span><input type="checkbox" data-chg="pref" data-k="email" ${P.prefs.email ? 'checked' : ''}></label></div></section>
  <section class="card" style="margin-top:14px"><div class="card-h"><h2>Account &amp; privacy</h2></div><div class="card-b"><div class="note info">${ic('lock')}<div>Your login is issued by the centre. You set your own password at first sign-in, and you can reset it by email or ask the centre. No SMS OTP is used.</div></div><p class="small muted" style="margin:10px 0 0">Your consent to the centre processing your child’s data is recorded when you join. You can ask the centre for a copy of your data, or for it to be deleted.</p></div></section>
  <section class="card" style="margin-top:14px;border-style:dashed"><div class="card-h"><h2>Demo account</h2><span class="chip info">Demo only</span></div><div class="card-b"><label class="field"><span>View the app as another parent</span><select class="input" data-chg="parent-as">${S.parents.slice().sort(by(p => (p.children.length > 1 ? '0' : '1') + p.name)).map(p => `<option value="${p.id}" ${p.id === P.id ? 'selected' : ''}>${esc(p.name)} — ${p.children.map(c => stu(c).first).join(', ')}</option>`).join('')}</select></label></div></section>`;
ACT['pref'] = el => { const P = par(S.ui.parentId); P.prefs[el.dataset.k] = el.checked; save(); toast('Notification preference saved.'); };
ACT['parent-as'] = el => { S.ui.parentId = el.value; S.ui.childId = par(el.value).children[0]; save(); toast(`Now viewing as ${par(el.value).name} (demo).`, 'info'); go('#/parent/home'); };

/* =====================================================================
   Guided tour (~4 minutes). Each "Next" performs the step if the
   visitor has not done it themselves, so the story always continues.
   ===================================================================== */
const TOUR = { on:false, i:0, scrolled:-1 };
const HEAD_A = () => ({ kind:'head', id:'head', name:S.head.name });
const PRIYA_A = () => ({ kind:'parent', id:'p1', name:par('p1').name });
const TSTEPS = [
  { r:'#/', t:'.roles', h:'Welcome to Vovix Centre Management', p:'This tour follows one day at a sample centre. A parent drops off a child, the Centre Head approves it, the parent picks up, and a fee is collected. Press Next, or click inside the app at any time.' },
  { r:'#/head/dashboard', t:'[data-tour=kpis]', h:'1 · The Centre Head’s dashboard', p:'Today at a glance: students expected, checked in and still at the centre, pickups completed, pending approvals and this month’s fees. Every number updates live as the day goes on.' },
  { r:'#/parent/home', t:'[data-tour=drop]', h:'2 · Parent drop-off', p:'Priya Raman has two children here. With Aarav selected, she taps Drop-off when she arrives, and the request reaches the centre with the exact time.',
    prep(){ if (S.settings.mode !== 'A'){ S.settings.mode = 'A'; toast('Tour switched attendance to Mode A (parent request + approval).', 'info'); } S.ui.parentId = 'p1'; S.ui.childId = 's1'; save(); },
    next(){ const st = stOf(recOf('s1', todayKey())); if (st === 'none' || st === 'drop_rejected'){ A.parentDrop('s1', PRIYA_A()); toast('Tour: drop-off requested for Aarav.', 'info'); } } },
  { r:'#/head/attendance?tab=pending', t:'[data-tour=approve-row]', h:'3 · Attendance approval', p:'The request appears straight away for the Centre Head. Drop-offs can be approved one at a time or together after a confirmation. Approve Aarav, or press Next.',
    next(){ const r = recOf('s1', todayKey()); if (r?.drop?.status === 'pending'){ A.approveDrop(r.id, HEAD_A()); toast('Tour: drop-off approved.', 'info'); } } },
  { r:'#/parent/home', t:'[data-tour=pick]', h:'4 · Parent pickup', p:'Priya’s app now shows the drop-off as confirmed, with the approval time. At the end of class she taps Pick-up and chooses who is collecting. Today it is Grandmother Kamala.',
    prep(){ S.ui.parentId = 'p1'; S.ui.childId = 's1'; save(); },
    next(){ if (stOf(recOf('s1', todayKey())) === 'present'){ const s = stu('s1'); A.parentPick('s1', (s.guardians.find(g => g.rel === 'Grandmother') || s.guardians[0]).id, PRIYA_A()); toast('Tour: pickup requested.', 'info'); } } },
  { r:'#/head/attendance?tab=pending', t:'[data-tour=pick-row]', h:'5 · Verified handover', p:'Pickups are never approved in bulk. The Head checks the person against Aarav’s authorised guardians and confirms their identity before handing him over. Click Verify to try it.',
    next(){ const r = recOf('s1', todayKey()); if (r?.pick?.status === 'pending'){ A.verifyPick('s1', r.pick.gid, true, HEAD_A()); toast('Tour: pickup verified — Aarav handed over.', 'info'); } } },
  { r:'#/head/student/s1', t:'[data-tour=record-pay]', h:'6 · Fee collection', p:'Aarav’s fee account shows each due, any discount, partial payments and the balance. Record payment accepts cash, UPI or bank transfer, with no payment gateway needed.',
    next(){ const d = openDues('s1')[0]; if (d){ const p = A.recordPayment({ dueId:d.id, amount:balOf(d), method:'UPI', ref:'431286509921', date:todayKey(), discount:0 }, HEAD_A()); if (p){ UI.f.rcptId = p.id; toast(`Tour: ${inr(p.amount)} recorded by UPI.`, 'info'); } } } },
  { r:'#/head/receipts', t:'[data-tour=receipt-preview]', h:'7 · Receipt generation', p:'The receipt is issued straight away with a unique, sequential number. Print it, save it as PDF, or void it with a reason. Numbers are never reused. Priya can see it in her app now.',
    prep(){ const p = payOf('s1')[0]; if (p) UI.f.rcptId = p.id; } },
  { r:'#/head/messages', t:'[data-tour=wa-preview]', h:'8 · WhatsApp preview', p:'Fee reminders, overdue notices and receipts as WhatsApp messages. Automation is planned for Phase 2, after provider and template approval. Nothing is sent from this demo.',
    prep(){ UI.f.waT = 'receipt'; } },
  { r:'#/head/reports', t:'[data-tour=reports]', h:'9 · Reports', p:'Daily and student attendance, batch-wise reports, monthly collections and outstanding fees. Filter by date and batch, and export to CSV.',
    prep(){ UI.f.repTab = 'daily'; } },
  { r:'#/parent/fees', t:'[data-tour=p-fees]', h:'10 · The loop closes for the parent', p:'Back in Priya’s app, the payment and receipt are already there. All three roles share the same live data.',
    prep(){ S.ui.parentId = 'p1'; S.ui.childId = 's1'; save(); } },
  { r:'#/', t:'.cta-band', h:'That’s the full day', p:'Next, try Mode B (staff-confirmed attendance) in Settings, open the Staff app, or explore on your own. Reset demo restores the sample data at any time. To see this running at your centre, contact Vovix.' },
];
function tourStart(){ closeModal(true); TOUR.on = true; TOUR.i = 0; tourShow(); }
function tourEnd(){ if (!TOUR.on) return; TOUR.on = false; $('#tourRoot').innerHTML = ''; }
function tourShow(){
  const st = TSTEPS[TOUR.i]; TOUR.scrolled = -1;
  guard(() => st.prep?.());
  const [path, qs] = st.r.split('?'); if (qs) applyQFrom(qs);
  if (location.hash.split('?')[0] !== path || (path === '#/' && location.hash !== '#/')) location.hash = st.r; else render(false);
  tourPlace();
}
function applyQFrom(qs){ Object.entries(Object.fromEntries(new URLSearchParams(qs))).forEach(([k, v]) => { UI.f[QMAP[k] || k] = v; }); }
function tourPlace(){
  if (!TOUR.on) return;
  const st = TSTEPS[TOUR.i]; const root = $('#tourRoot'); const el = st.t ? $(st.t) : null;
  if (el && TOUR.scrolled !== TOUR.i){ TOUR.scrolled = TOUR.i; el.scrollIntoView({ block:'center', behavior:'instant' in document.documentElement.style ? 'instant' : 'auto' }); }
  const r = el?.getBoundingClientRect(); const pad = 8; const last = TOUR.i === TSTEPS.length - 1;
  root.innerHTML = `${r ? `<div class="tour-spot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px"></div>` : `<div class="tour-spot" style="left:50%;top:40%;width:0;height:0"></div>`}
  <div class="tour-card" role="dialog" aria-modal="false" aria-labelledby="tourH" id="tourCard"><div class="row between"><span class="label">Demo tour · ${TOUR.i + 1} of ${TSTEPS.length}</span><button class="icon-btn" data-act="tour-end" aria-label="End tour">${ic('x','i-sm')}</button></div>
  <h3 id="tourH">${st.h}</h3><p>${st.p}</p><div class="tprog"><span style="width:${100 * (TOUR.i + 1) / TSTEPS.length}%"></span></div>
  <div class="tf"><button class="btn sm ghost" data-act="tour-end">End tour</button><span class="grow"></span>${TOUR.i ? `<button class="btn sm" data-act="tour-back">${ic('back','i-sm')} Back</button>` : ''}<button class="btn sm primary" data-act="tour-next" id="tourNext">${last ? 'Finish' : 'Next'} ${last ? '' : ic('arrow','i-sm')}</button></div></div>`;
  const card = $('#tourCard'); const ch = card.offsetHeight; const cw = card.offsetWidth; const vw = innerWidth, vh = innerHeight;
  if (vw > 640){
    let top, left;
    if (!r){ top = vh/2 - ch/2; left = vw/2 - cw/2; }
    else if (r.bottom + pad + 14 + ch < vh){ top = r.bottom + pad + 14; left = Math.min(Math.max(16, r.left), vw - cw - 16); }
    else if (r.top - pad - 14 - ch > 56){ top = r.top - pad - 14 - ch; left = Math.min(Math.max(16, r.left), vw - cw - 16); }
    else { top = Math.max(64, Math.min(vh - ch - 16, r.top)); left = r.right + 24 + cw < vw ? r.right + 24 : Math.max(16, r.left - cw - 24); }
    card.style.top = top + 'px'; card.style.left = left + 'px';
  }
}
let tourRaf = 0; const tourRe = () => { if (!TOUR.on) return; cancelAnimationFrame(tourRaf); tourRaf = requestAnimationFrame(() => { const el = $(TSTEPS[TOUR.i].t); const sp = $('.tour-spot'); if (el && sp){ const r = el.getBoundingClientRect(); Object.assign(sp.style, { left:r.left - 8 + 'px', top:r.top - 8 + 'px', width:r.width + 16 + 'px', height:r.height + 16 + 'px' }); } }); };
window.addEventListener('scroll', tourRe, { passive:true }); document.getElementById('screen').addEventListener('scroll', tourRe, { passive:true }); window.addEventListener('resize', () => { if (TOUR.on) tourPlace(); });
ACT['tour-start'] = () => tourStart();
ACT['tour-end'] = () => tourEnd();
ACT['tour-back'] = () => { if (TOUR.i > 0){ TOUR.i--; tourShow(); } };
ACT['tour-next'] = () => { const st = TSTEPS[TOUR.i]; guard(() => st.next?.()); if (TOUR.i >= TSTEPS.length - 1){ tourEnd(); toast('Tour complete. Explore freely, or press Reset demo to start over.'); return; } TOUR.i++; tourShow(); };

/* =====================================================================
   Boot
   ===================================================================== */
(function boot(){
  load();
  const sp = new URLSearchParams(location.search); const role = sp.get('role');
  if (role && !location.hash){ const map = { head:'#/head/dashboard', staff:'#/staff/today', parent:'#/parent/home' }; if (map[role]) history.replaceState(null, '', location.pathname + location.search + map[role]); }
  applyQ(); render(false);
  if (sp.get('tour') === '1') setTimeout(tourStart, 300);
  setInterval(() => { if (!MODAL && !TOUR.on && document.visibilityState === 'visible' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(false); }, 60000);
})();
</script>
