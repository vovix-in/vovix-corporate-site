  <rect x="520" y="223" width="70" height="18" rx="4" fill="rgba(0,200,83,0.12)"/>
  <text x="555" y="236" font-size="10" font-weight="700" fill="#00a844" text-anchor="middle">TP 1.0902</text>
  <line x1="66" y1="286" x2="520" y2="286" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5,4"/>
  <rect x="520" y="277" width="70" height="18" rx="4" fill="rgba(16,42,67,0.08)"/>
  <text x="555" y="290" font-size="10" font-weight="700" fill="#102a43" text-anchor="middle">1.0842</text>
  <line x1="66" y1="338" x2="520" y2="338" stroke="#ef5350" stroke-width="1.4" stroke-dasharray="5,4"/>
  <rect x="520" y="329" width="70" height="18" rx="4" fill="rgba(239,83,80,0.12)"/>
  <text x="555" y="342" font-size="10" font-weight="700" fill="#ef5350" text-anchor="middle">SL 1.0818</text>
  <circle cx="380" cy="286" r="4.5" fill="#0071e3" stroke="white" stroke-width="1.5"/>

